# Шаблон секрета. НЕ коммитьте реальные значения.
# Примените вручную в кластере:
#   kubectl apply -f k8s/secret.example.yaml   (после подстановки значений)
# или создайте из CLI:
#   kubectl create secret generic zazyvala-bot-secret \
#     --from-literal=BOT_TOKEN='123:ABC' \
#     --from-literal=DATABASE_URL='postgresql://user:pass@postgres:5432/zazyvala?schema=public'
apiVersion: v1
kind: Secret
metadata:
  name: zazyvala-bot-secret
  namespace: default
type: Opaque
stringData:
  BOT_TOKEN: "REPLACE_WITH_REAL_TOKEN"
  DATABASE_URL: "postgresql://user:password@postgres:5432/zazyvala?schema=public"
  # Токен доступа к веб-админке (/admin). Без него админка отключена (401).
  ADMIN_TOKEN: "REPLACE_WITH_LONG_RANDOM_TOKEN"
