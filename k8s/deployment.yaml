apiVersion: apps/v1
kind: Deployment
metadata:
  name: zazyvala-bot
  namespace: default
  annotations:
    # Keel auto-deploy: при появлении нового образа :latest в GHCR Keel
    # сам обновляет деплоймент (опрос раз в минуту). Kubeconfig в CI не нужен.
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 1m"
spec:
  # Один инстанс: long polling нельзя запускать в нескольких репликах
  # (Telegram отдаёт getUpdates только одному потребителю).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zazyvala-bot
  template:
    metadata:
      labels:
        app: zazyvala-bot
    spec:
      containers:
        - name: zazyvala-bot
          image: ghcr.io/1t1scool/zazyvala-bot:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zazyvala-bot-secret
                  key: BOT_TOKEN
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: zazyvala-bot-secret
                  key: DATABASE_URL
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zazyvala-bot-secret
                  key: ADMIN_TOKEN
                  optional: true
            - name: BOT_MODE
              value: "polling"
            - name: LOG_LEVEL
              value: "log"
            - name: PORT
              value: "3000"
          # Несекретная конфигурация (напр. BOT_COMMANDS). optional — без неё
          # бот использует встроенные значения по умолчанию.
          envFrom:
            - configMapRef:
                name: zazyvala-bot-config
                optional: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      imagePullSecrets:
        - name: ghcr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: zazyvala-bot
  namespace: default
spec:
  selector:
    app: zazyvala-bot
  ports:
    - name: http
      port: 80
      targetPort: 3000
