name: Build & Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/1t1scool/zazyvala-bot

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to k8s
        # Пропускаем деплой, пока не задан секрет KUBE_CONFIG (образ всё равно собран и запушен).
        if: ${{ env.KUBE_CONFIG != '' }}
        run: |
          echo "$KUBE_CONFIG" | base64 -d > /tmp/kube.yaml
          export KUBECONFIG=/tmp/kube.yaml
          sed "s|IMAGE_TAG|${{ github.sha }}|g" k8s/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/zazyvala-bot --timeout=120s
